name: update

on:
  schedule:
    # GitHub найсильніше затримує запуски на початку години, тож хвилини — не :00.
    # Основний: 16:17 (зима) / 17:17 (літо) за Києвом, коли НБУ вже встановив курс на завтра.
    # Страхувальний: на випадок, якщо основний затримається або НБУ запізниться; без змін коміту не буде.
    - cron: "17 14 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Перезавантажити повну історію всіх валют (щоб підхопити старі виправлення НБУ)"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # коміт оновлених даних
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Свіжий main на момент старту: запуск, що чекав у черзі, побачить дані попереднього й не зробить дубль-коміт
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Export rates from NBU
        run: uv run python export.py --out data ${{ inputs.full && '--full' || '' }}

      # Пуш через GITHUB_TOKEN не запускає workflow повторно, тож циклу не буде
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Даних не змінилось"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "data: $(date -u +%F)"
          git push -q

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: data

      - id: deploy
        uses: actions/deploy-pages@v5
