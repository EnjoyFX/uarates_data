[project]
name = "uarates-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["export"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_also = ['if __name__ == "__main__":']
